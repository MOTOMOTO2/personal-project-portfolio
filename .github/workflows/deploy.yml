name: Deploy to GitHub Pages

# Builds on every push to main and publishes to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source -> "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm test

      - name: Build
        # A <user>.github.io repository is served from the domain root; any other
        # repository is a project site at https://<user>.github.io/<repo>/, and the
        # bundle and the router both need that prefix.
        env:
          VITE_BASE: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - name: Smoke-test the build
        env:
          VERIFY_BASE_JSON: ${{ endsWith(github.event.repository.name, '.github.io') && '"/"' || format('"/{0}/"', github.event.repository.name) }}
        run: node scripts/verify-dist.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
