<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Aden Yadegar · Full-stack developer</title>
    <meta
      name="description"
      content="Aden Yadegar is a full-stack developer in Ontario, Canada. Projects, screenshots and write-ups: RevVault, Course Deadline Tracker, Claude Remote, Care Track and more."
    />
    <meta name="author" content="Aden Yadegar" />
    <meta name="theme-color" content="#0b0a09" />

    <!-- Link previews for LinkedIn, Slack, iMessage, etc. These crawlers need an
         absolute URL to a PNG or JPG; update it if the site moves to a new domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aden Yadegar · Full-stack developer" />
    <meta
      property="og:description"
      content="Full-stack web apps, offline and real-time sync, and AI tools, with write-ups, screenshots and hands-on demos you can try in the page."
    />
    <meta property="og:image" content="https://motomoto2.github.io/personal-project-portfolio/images/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the theme before first paint so there is never a flash. Dark is
      // the default; "paper" (light) only when the visitor chose it. Kept in
      // sync with src/lib/theme.ts.
      var dark = true
      try {
        dark = localStorage.getItem('portfolio-theme') !== 'light'
      } catch (error) {
        /* private mode: keep the default */
      }
      if (dark) document.documentElement.classList.add('dark')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
